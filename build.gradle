plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom-remap' version '1.18.2'
	id 'ploceus' version '1.18.1'
}

repositories {
	mavenCentral()

	maven {
		name = 'Polyfrost Releases'
		url = 'https://repo.polyfrost.org/releases'
	}

	maven {
		name = 'Polyfrost Snapshots'
		url = 'https://repo.polyfrost.org/snapshots'
	}
}

loom {
	fabricModJsonPath = rootProject.file(
		"src/main/resources/fabric.mod.json"
	)

	runConfigs.all {
		preferGradleTask = true
		generateRunConfig = true
		runDirectory = rootProject.file("run")
		jvmArguments.add("-Dmixin.debug.export=true")
	}

	runConfigs.remove(runConfigs["server"])
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	mappings ploceus.featherMappings(project.feather_build)

	ploceus.dependOsl(project.osl_version)

}
